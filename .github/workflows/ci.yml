name: CI

# Pushes to main run these jobs through deploy.yml (workflow_call), before deploying.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Check formatting
        run: ./mvnw -B -ntp spotless:check

      - name: Unit and integration tests
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend (Node LTS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test:ci -- --reporter=default --reporter=junit --outputFile.junit=test-reports/junit.xml

      - name: Build
        run: npm run build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-test-reports
          path: frontend/test-reports/
          if-no-files-found: ignore
          retention-days: 7

  # Playwright against the full dev stack (docker-compose.yml + docker-compose.e2e.yml).
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start the stack
        run: npm run stack:up

      - name: Run Playwright
        run: npm test

      - name: Stack logs
        if: failure()
        run: docker compose -f ../docker-compose.yml -f ../docker-compose.e2e.yml logs --no-color > stack.log

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/stack.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: npm run stack:down

  # Preview of the SPA on Cloudflare Pages, one alias per PR branch, linked in a PR comment.
  # Skipped for PRs from forks, which get no secrets.
  preview-frontend:
    name: Frontend preview (Cloudflare Pages)
    needs: frontend
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: https://api.foody.jotave.dev
      VITE_WS_URL: wss://api.foody.jotave.dev/ws
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The branch name ends up in a shell command: keep only characters Pages accepts in an alias.
      - name: Preview branch name
        id: branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: echo "name=$(printf '%s' "$HEAD_REF" | tr -c 'A-Za-z0-9-' '-')" >> "$GITHUB_OUTPUT"

      - name: Deploy preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name=foody --branch=${{ steps.branch.outputs.name }}

      - name: Comment preview URL on the PR
        uses: actions/github-script@v9
        env:
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- foody-frontend-preview -->'
            const body = [
              marker,
              '**Preview do frontend (Cloudflare Pages)**',
              '',
              `- Branch: ${process.env.ALIAS_URL || '(sem alias)'}`,
              `- Deploy deste commit: ${process.env.DEPLOYMENT_URL}`,
              '',
              `Commit: ${context.sha.slice(0, 7)}. O preview usa a API de produção (CORS libera https://*.foody.pages.dev): os dados são reais.`,
            ].join('\n')
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
