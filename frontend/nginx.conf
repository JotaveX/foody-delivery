# Same routing as the Vite dev server (vite.config.ts): /api without its prefix and /ws to the
# backend, everything else is the SPA.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        # The refresh token cookie is scoped to the API's /auth, which the browser sees as /api/auth.
        proxy_cookie_path /auth /api/auth;
    }

    # STOMP over WebSocket. The browser's Origin header goes through untouched, so the backend
    # checks it against CORS_ALLOWED_ORIGINS.
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # Vite fingerprints everything under /assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes (/orders/42, /reset-password?token=…) all load index.html.
    location / {
        try_files $uri /index.html;
    }
}
