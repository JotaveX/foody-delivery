spring:
  application:
    name: foody-tracker
  profiles:
    default: dev

  datasource:
    # PRAGMAs are applied by sqlite-jdbc on every new connection:
    # - journal_mode=WAL: readers don't block the writer and vice versa
    # - busy_timeout=5000: wait up to 5s for the write lock instead of failing with SQLITE_BUSY
    # - foreign_keys=ON: SQLite ships with FK enforcement disabled by default
    url: jdbc:sqlite:${SQLITE_PATH:./data/tracker.db}?journal_mode=WAL&busy_timeout=5000&foreign_keys=true
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite allows a single writer at a time; WAL lets reads run concurrently with it.
      # A large pool would only add connections queueing on the same file lock, so we keep
      # it small: enough for a few concurrent readers, with writes serialized by busy_timeout.
      maximum-pool-size: 4
      minimum-idle: 1
      pool-name: sqlite-pool

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only checks it matches the entities.
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Everything kept in Redis is optional for a request (the cache falls back to the database,
      # the rate limit fails open), so a Redis that hangs must fail fast instead of holding the
      # request for Lettuce's 60s default.
      timeout: 1s
      connect-timeout: 1s

  # Only used when app.mail.provider=smtp. Without SMTP_HOST Boot creates no JavaMailSender.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT2H}
  mail:
    # resend (HTTP API) or smtp (spring.mail.*).
    provider: ${MAIL_PROVIDER:resend}
    # "Name <address>"; with Resend the domain must be verified in the Resend dashboard.
    from: ${MAIL_FROM}
    resend:
      api-key: ${RESEND_API_KEY:}
      base-url: ${RESEND_BASE_URL:https://api.resend.com}
      timeout: 10s
  password-reset:
    # SPA page that reads ?token= (Cloudflare Pages in production).
    url: ${PASSWORD_RESET_URL:https://foody.jotave.dev/reset-password}
    ttl: 30m
    # At most one reset e-mail per user in this interval.
    cooldown: 1m
  catalog:
    # Public, credential-free URL of the catalog images (the images bucket, also in dev); a
    # product's imageUrl is this base + "/" + its image_key.
    image-base-url: ${CATALOG_IMAGE_BASE_URL:https://storage.googleapis.com/bright-torus-356608-foody-images}
  cors:
    # Exact origins (comma-separated) allowed to call the API cross-origin and to open /ws.
    # Production: the SPA on Cloudflare Pages.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://foody.jotave.dev}
    # Origin patterns (comma-separated, * matches part of the host): Cloudflare Pages previews,
    # one subdomain per PR branch. Only the Pages project owner can deploy under foody.pages.dev.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.foody.pages.dev}
  idempotency:
    # How long a POST /orders Idempotency-Key is remembered (in progress or completed).
    ttl: 24h
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Reverse proxies (IPs or CIDRs, comma-separated) whose X-Forwarded-For is trusted to find
    # the client IP. Empty: the header is ignored. In production set it to Caddy's address on the
    # Docker network; never to a range that internet clients can reach directly.
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}
    # Per client IP, on public endpoints (the key names the Redis bucket).
    per-ip:
      login:
        path: /auth/login
        capacity: 5
        period: 1m
      register:
        path: /auth/register
        capacity: 3
        period: 1m
      forgot-password:
        path: /auth/forgot-password
        capacity: 3
        period: 1m
      reset-password:
        path: /auth/reset-password
        capacity: 5
        period: 1m
    # Per user, on every authenticated request.
    per-user:
      capacity: 100
      period: 1m

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          # Redis holds all ephemeral state (rate limit, idempotency, cache, pub/sub),
          # so an instance without it should not receive traffic.
          include: readinessState,redis

---
spring:
  config:
    activate:
      on-profile: dev
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}

app:
  jwt:
    # Dev-only default; production must provide JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789abcdef}
  mail:
    # Mailpit (docker compose); MAIL_PROVIDER=resend with RESEND_API_KEY tests the real provider.
    provider: ${MAIL_PROVIDER:smtp}
    from: ${MAIL_FROM:Foody <no-reply@foody.local>}
  password-reset:
    url: ${PASSWORD_RESET_URL:http://localhost:5173/reset-password}
  cors:
    # The Vite dev server (it also proxies /api and /ws, which then need no CORS).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
